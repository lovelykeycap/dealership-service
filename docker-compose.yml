services:
  order-db:
    image: postgres:16-alpine
    container_name: dealership-order-postgres
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5433:5432"
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-db:
    image: postgres:16-alpine
    container_name: dealership-storage-postgres
    environment:
      POSTGRES_DB: storage_db
      POSTGRES_USER: storage_user
      POSTGRES_PASSWORD: storage_password
    ports:
      - "5435:5432"
    volumes:
      - storage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage_user -d storage_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8081:8080"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dealership-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: dealership-order-service
    depends_on:
      order-db:
        condition: service_healthy
      storage-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order_db
      ORDER_DB_USER: order_user
      ORDER_DB_PASSWORD: order_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8081/realms/dealership
      STORAGE_SERVICE_BASE_URL: http://storage-service:8082
      ORDER_STORAGE_GRPC_ADDRESS: static://storage-service:9091
      STORAGE_GRPC_TIMEOUT_MS: 5000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    container_name: dealership-storage-service
    depends_on:
      storage-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      STORAGE_DB_URL: jdbc:postgresql://storage-db:5432/storage_db
      STORAGE_DB_USER: storage_user
      STORAGE_DB_PASSWORD: storage_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8081/realms/dealership
      SERVER_PORT: 8082
      GRPC_SERVER_PORT: 9091
    ports:
      - "8082:8082"
      - "9091:9091"

volumes:
  order_pg_data:
  storage_pg_data:
  keycloak_pg_data:
