databaseChangeLog:
  - changeSet:
      id: 004-001-create-outbox-events
      author: nikita
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false
              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: exchange_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: routing_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: trace_id
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: TEXT
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_aggregate_id
            columns:
              - column:
                  name: aggregate_id

        - sql:
            sql: ALTER TABLE outbox_events ADD CONSTRAINT ck_outbox_events_status CHECK (status IN ('NEW','SENT','FAILED'))

      rollback:
        - dropTable:
            tableName: outbox_events
